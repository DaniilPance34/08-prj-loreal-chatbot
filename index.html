<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'Oréal Beauty Advisor</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page-wrapper">
    <header class="site-header">
      <!-- Replace logo.png with the provided logo filename -->
      <img
        src="img/loreal-logo.png"
        alt="L'Oréal Logo"
        class="brand-logo"
      />
      <h1>Your Personal Beauty Advisor</h1>
      <p>Discover beauty made for you.</p>
    </header>

    <main>
      <section class="chatbox">
        <div class="chat-heading">
          <span class="online-dot"></span>
          <span>L'Oréal AI Assistant</span>
        </div>

        <div id="latestQuestion" class="latest-question"
             aria-live="polite"></div>

        <div id="chatWindow" class="chat-window"
             aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">
            Your message
          </label>

          <input
            id="userInput"
            type="text"
            placeholder="Ask about skincare, makeup, haircare..."
            autocomplete="off"
            required
          />

          <button type="submit" id="sendBtn">
            <span class="material-icons">send</span>
            <span class="visually-hidden">Send</span>
          </button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>Educational AI chatbot demo inspired by L'Oréal.</p>
      <p>Not an official L'Oréal service.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
